name: Image

# Builds the backend image, pushes it to GHCR and asks the private deploy
# repository to roll it out.
#
#   push to main    -> deploy environment "production"
#   push to develop -> deploy environment "develop"
#
# The build runs on a GitHub-hosted runner. The servers run their own
# self-hosted runners, but those are registered on the private deploy
# repository only: this repository is public, and a self-hosted runner here
# would let anyone run code on a server through a pull request.
#
# Tags: `sha-<commit>` (immutable, what gets deployed, by digest) and the
# branch name (moves with every push).
#
# Secret (optional; without it the image is pushed and nothing is deployed)
#   DEPLOY_DISPATCH_TOKEN   fine-grained token on the deploy repository only,
#                           "Contents: Read and write" (needed to send a
#                           repository_dispatch event)

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/assay-ai/assay-backend

jobs:
  image:
    if: github.ref_name == 'main' || github.ref_name == 'develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: production
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}

      - name: Ask the deploy repository to roll it out
        env:
          DEPLOY_DISPATCH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'develop' }}
          IMAGE_REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          if [ -z "$DEPLOY_DISPATCH_TOKEN" ]; then
            echo "::notice::DEPLOY_DISPATCH_TOKEN is not set: image pushed, nothing deployed"
            exit 0
          fi
          payload=$(jq -n --arg environment "$ENVIRONMENT" --arg image "$IMAGE_REF" --arg sha "$GITHUB_SHA" \
            '{event_type: "backend-image", client_payload: {environment: $environment, image: $image, sha: $sha}}')
          curl -fsS -X POST \
            -H "Authorization: Bearer $DEPLOY_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/assay-ai/assay-deploy/dispatches \
            -d "$payload"
          echo "::notice::deploy requested: $ENVIRONMENT <- $IMAGE_REF"
