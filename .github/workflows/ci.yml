name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # `@solana-program/token` declares engines.node >= 24.
          node-version: 24
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Settlement client matches the vendored IDL
        run: yarn client:check

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build

      - name: Unit tests
        # The unit suite needs no database, Redis or network.
        run: yarn test
