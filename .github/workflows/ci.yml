name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # `@solana-program/token` declares engines.node >= 24.
          node-version: 24
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Settlement client matches the vendored IDL
        run: yarn client:check

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build

      - name: Unit tests
        # The unit suite needs no database, Redis or network.
        run: yarn test

  egress-relay:
    # The Cloudflare Worker in `workers/egress-relay` has its own package and
    # lockfile; the backend's `yarn test` does not reach it.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/egress-relay
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: workers/egress-relay/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Tests
        run: npm test
