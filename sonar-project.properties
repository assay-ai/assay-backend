# SonarQube analysis settings for assay-backend.
#
# Run from the repository root with a SonarQube server and token, e.g.:
#   docker run --rm -e SONAR_HOST_URL=... -e SONAR_TOKEN=... \
#     -v "$PWD:/usr/src" sonarsource/sonar-scanner-cli

sonar.projectKey=assay-backend
sonar.projectName=assay-backend

sonar.sources=src,scripts,packages,kora,Dockerfile,docker-compose.yml
sonar.tests=test
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.min.js

# Reviewed exception: typescript:S1313 (hardcoded IP address) in the SSRF
# egress guard. ip-rules.ts exists to recognise and REFUSE the cloud
# instance-metadata endpoints (169.254.169.254 and friends) and the IPv6
# transition prefixes that can smuggle an IPv4 address past the IPv4 rules.
# These literals are the blocklist itself and are never dialled; removing them
# would weaken the control the rule is trying to protect. Scoped to this one
# rule on this one file, so a hardcoded address anywhere else is still flagged.
sonar.issue.ignore.multicriteria=ssrfblocklist
sonar.issue.ignore.multicriteria.ssrfblocklist.ruleKey=typescript:S1313
sonar.issue.ignore.multicriteria.ssrfblocklist.resourceKey=src/shared/network/egress/ip-rules.ts
